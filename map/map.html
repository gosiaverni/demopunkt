<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Mapa wydarzeń</title>

  <link rel="stylesheet" href="/start/start.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />

  <style>
    #map {
      height: 100vh;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    #map.visible {
      opacity: 1;
    }

    .map-loader {
      position: absolute;
      inset: 0;
      background: white;
      z-index: 10;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      transition: opacity 0.3s ease;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #ddd;
      border-top: 4px solid black;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 10px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>

<body>

<header class="navbar">
  <div class="logo" onclick="location.href='/'">Punkt Sztuki</div>

  
</header>





<main class="map-page">
  <div class="map-container">

    <div id="map-loader" class="map-loader">
      <div class="spinner"></div>
      <p>Ładowanie mapy...</p>
    </div>

    <div class="map-filter">

      <div class="category-dropdown" id="category-dropdown">

        <button
          type="button"
          class="category-dropdown-button"
          id="category-dropdown-button"
        >
          wszystkie kategorie
        </button>

        <div
          class="category-dropdown-menu"
          id="category-dropdown-menu"
        >

          <label>
            <input type="checkbox" value="malarstwo">
            <span>malarstwo</span>
          </label>

          <label>
            <input type="checkbox" value="rzeźba">
            <span>rzeźba</span>
          </label>

          <label>
            <input type="checkbox" value="architektura">
            <span>architektura</span>
          </label>

          <label>
            <input type="checkbox" value="grafika">
            <span>grafika</span>
          </label>

          <label>
            <input type="checkbox" value="rysunek">
            <span>rysunek</span>
          </label>

          <label>
            <input type="checkbox" value="fotografia">
            <span>fotografia</span>
          </label>

          <label>
            <input type="checkbox" value="wideoart">
            <span>wideo-art</span>
          </label>

          <label>
            <input type="checkbox" value="sztuka uzytkowa">
            <span>sztuka użytkowa</span>
          </label>

          <label>
            <input type="checkbox" value="inne">
            <span>inne</span>
          </label>

        </div>

      </div>

    </div>

    <div id="map"></div>

  </div>
</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/supabase.js"></script>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script src="/start/start.js"></script>
<script src="/map/map.js"></script>

</body>
</html>
