<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Mapa wydarzeń</title>

  <link rel="stylesheet" href="/start/start.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />

  <style>
    #map {
      height: 100vh;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    #map.visible {
      opacity: 1;
    }

    .map-loader {
      position: absolute;
      inset: 0;
      background: white;
      z-index: 10;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      transition: opacity 0.3s ease;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #ddd;
      border-top: 4px solid black;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 10px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>

<body>

<header class="navbar">
  <div class="logo" onclick="location.href='/'">Punkt Sztuki</div>

  
</header>





<main class="map-page">
  <div class="map-container">

    <div id="map-loader" class="map-loader">
  <div class="spinner"></div>
  <p>Ładowanie mapy...</p>
</div>

<div class="map-filter">

  <select id="map-category-select" class="city-select">

    <option value="">
      wszystkie kategorie
    </option>

    <option value="malarstwo">
      malarstwo
    </option>

    <option value="rzeźba">
      rzeźba
    </option>

    <option value="architektura">
      architektura
    </option>

    <option value="grafika">
      grafika
    </option>

    <option value="rysunek">
      rysunek
    </option>

    <option value="fotografia">
      fotografia
    </option>

    <option value="wideoart">
      wideo-art
    </option>

    <option value="sztuka uzytkowa">
      sztuka użytkowa
    </option>

    <option value="inne">
      inne
    </option>

  </select>

</div>

<div id="map"></div>

  </div>
</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/supabase.js"></script>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script src="/start/start.js"></script>
<script src="/map/map.js"></script>

</body>
</html>
